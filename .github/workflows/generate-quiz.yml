name: 產生線上複習頁面

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube 影片網址'
        required: true
        type: string

# 給予發布 Pages 與寫入倉庫的權限
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 取得 repo
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install google-genai youtube-transcript-api

      - name: 出題並產生網頁
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_from_url.py "${{ inputs.youtube_url }}"

      - name: 提交並推送產生的頁面
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add online_study/
          git diff --cached --quiet && echo "沒有變動,略過 commit" || git commit -m "自動產生複習頁面: ${{ inputs.youtube_url }}"
          git push

      # 強制發布 Pages 到網站上
      - name: 上傳 Pages 檔案
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'online_study'

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
