name: 產生線上複習頁面

# 在 GitHub 網頁(手機瀏覽器也可以)上,
# 進到這個 repo 的 Actions 分頁 → 選這個 workflow → 右上「Run workflow」,
# 貼上 YouTube 網址、按 Run,就會自動出題、產生網頁、發布到 GitHub Pages。
on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube 影片網址"
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 取得 repo
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install google-genai

      - name: 出題並產生網頁
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_from_url.py "${{ inputs.youtube_url }}"

      - name: 提交並推送產生的頁面
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add online_study/
          git diff --cached --quiet && echo "沒有變動,略過 commit" || git commit -m "自動產生複習頁面:${{ inputs.youtube_url }}"
          git push
