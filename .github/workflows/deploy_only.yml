name: 部署複習頁面(不出題)
on:
  push:
    paths:
      - 'online_study/**'
  workflow_dispatch: {}
# 給予發布 Pages 的權限
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 取得 repo
        uses: actions/checkout@v4
      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install google-genai
      - name: 重建複習清單頁(不呼叫Gemini,順便自我檢查靜態資產)
        run: python scripts/generate_from_url.py --rebuild-index
      - name: 上傳 Pages 檔案
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'online_study'
      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
