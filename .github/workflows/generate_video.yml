name: 產生線上複習頁面
on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube 影片網址或播放清單網址'
        required: true
        type: string
      with_transcript:
        description: '強制產生修正逐字稿(.srt)?通常不用勾,自己頻道的影片會自動偵測開啟'
        required: false
        type: boolean
        default: false
      max_videos:
        description: '播放清單限定:這次最多新處理幾支影片(留空 = 不限制,額度內能做多少算多少;已經處理過的不算在這個數字裡,單支影片網址時這欄無效)'
        required: false
        type: string
        default: ''
# 給予發布 Pages 與寫入倉庫的權限
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  generate:
    runs-on: ubuntu-latest
    # 硬性上限:就算又發生什麼沒預料到的卡住,最多也只浪費 2 小時,
    # 不會像之前一樣卡到 GitHub 預設的 6 小時上限才被強制取消。
    timeout-minutes: 120
    steps:
      - name: 取得 repo
        uses: actions/checkout@v4
      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install google-genai
      - name: 出題並產生網頁
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MY_CHANNEL_ID: ${{ secrets.MY_CHANNEL_ID }}
          WITH_TRANSCRIPT: ${{ inputs.with_transcript }}
          # Python 預設在非終端機環境會把 print() 輸出暫存起來,累積到一定量才寫進 log,
          # 如果程式卡住被強制中斷,暫存但還沒寫出去的內容就會完全消失,log 看起來像
          # 「完全沒有執行」一樣,其實是有跑、只是看不到。設這個環境變數讓輸出即時寫出。
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "${{ inputs.max_videos }}" ]; then
            python scripts/generate_from_url.py "${{ inputs.youtube_url }}" --max-videos "${{ inputs.max_videos }}"
          else
            python scripts/generate_from_url.py "${{ inputs.youtube_url }}"
          fi
      - name: 提交並推送產生的頁面
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add online_study/
          if [ -f pending_queue.json ]; then git add pending_queue.json; fi
          if [ -f gemini_quota_state.json ]; then git add gemini_quota_state.json; fi
          git diff --cached --quiet && echo "沒有變動,略過 commit" || git commit -m "自動產生複習頁面: ${{ inputs.youtube_url }}"

          # 這個 job 常常要跑很久(長播放清單可能處理好幾小時),
          # 這段期間如果 main 被別的地方 push 過,直接 git push 會被拒絕(fetch first),
          # 導致這次好不容易處理完的結果整批推不上去、白跑。
          # 用 pull --rebase 把 commit 疊到最新的 main 上面再重推,最多重試 5 次。
          for i in 1 2 3 4 5; do
            if git push; then
              echo "✅ push 成功"
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "❌ 重試 5 次後仍然推送失敗"
              exit 1
            fi
            echo "⚠️ push 被拒絕,嘗試 git pull --rebase 後重推(第 $i 次)..."
            git pull --rebase origin main
          done
      - name: 上傳 Pages 檔案
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'online_study'
      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
