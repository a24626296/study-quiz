<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>複習清單</title>
<link rel="stylesheet" href="./style.css">
</head>
<body style="padding:20px;">
<div class="list-header">
  <h1 style="margin:0;">📚 複習清單(2)</h1>
  <button class="collapse-all-btn" id="collapse-toggle-btn" onclick="toggleCollapseAll()">📁 全部收合</button>
</div>

        <div class="item">
          <a class="item-link" href="./viewer.html?id=snfEyp6rTEE">
            <img src="https://i.ytimg.com/vi/snfEyp6rTEE/mqdefault.jpg" loading="lazy">
            <div class="meta">
              <div class="subject">起飛與降落性能 - V-Speeds 與進場分類</div>
              <div class="date">2026-08-01 20:11</div>
              <div class="vid">ID: snfEyp6rTEE</div>
            </div>
          </a>
          <div class="item-actions">
            <a class="yt-link" href="https://www.youtube.com/watch?v=snfEyp6rTEE" target="_blank" rel="noopener">▶ 原始影片</a>
            <button class="del-btn" onclick="deleteVideo('snfEyp6rTEE')">🗑 刪除</button>
          </div>
        </div>
        <div class="item">
          <a class="item-link" href="./viewer.html?id=qZv61bNeRzo">
            <img src="https://i.ytimg.com/vi/qZv61bNeRzo/mqdefault.jpg" loading="lazy">
            <div class="meta">
              <div class="subject">航空公司飛行員招募與評鑑心理學 (Airline Pilot Selection &amp; Assessment Psychology)</div>
              <div class="date">2026-08-01 15:49</div>
              <div class="vid">ID: qZv61bNeRzo</div>
            </div>
          </a>
          <div class="item-actions">
            <a class="yt-link" href="https://www.youtube.com/watch?v=qZv61bNeRzo" target="_blank" rel="noopener">▶ 原始影片</a>
            <button class="del-btn" onclick="deleteVideo('qZv61bNeRzo')">🗑 刪除</button>
          </div>
        </div>

<script>
var allCollapsed = false;

function toggleCollapseAll() {
  allCollapsed = !allCollapsed;
  document.querySelectorAll('.item').forEach(function(el) {
    el.classList.toggle('collapsed', allCollapsed);
  });
  document.getElementById('collapse-toggle-btn').textContent = allCollapsed ? '📂 全部展開' : '📁 全部收合';
}

function deleteVideo(id) {
  var pathParts = window.location.pathname.split('/').filter(Boolean);
  var repoName = pathParts[0] || '';
  var username = window.location.hostname.split('.')[0];
  var actionsUrl = 'https://github.com/' + username + '/' + repoName + '/actions/workflows/delete_video.yml';

  var doOpen = function() {
    alert('已複製影片 ID:' + id + '\n\n即將開啟「刪除線上複習頁面」的 Action 頁面,\n貼上這個 ID 到 video_id 欄位,按 Run workflow 即可刪除。');
    window.open(actionsUrl, '_blank');
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(id).then(doOpen).catch(doOpen);
  } else {
    doOpen();
  }
}
</script>
</body>
</html>
