<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>線上複習</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="top-bar">
  <button class="top-bar-toggle" id="top-bar-toggle-btn" onclick="toggleTopBar()">⚙ 顯示選項</button>
  <div class="top-bar-content" id="top-bar-content">
    <a class="back" href="./index.html">← 回複習清單</a>
    <div class="lang-toggle">
      顯示語言:
      <button id="btn-zh" class="lang-btn active" onclick="setLang('zh')">中文為主</button>
      <button id="btn-en" class="lang-btn" onclick="setLang('en')">English 為主</button>
      <span style="opacity:0.7;">(滑鼠移到題目/選項上可看另一種語言)</span>
    </div>
    <div class="pdf-link-row">
      📖 手冊 PDF 連結(可含頁碼錨點,例如 .../manual.pdf#page=42):
      <input type="text" id="pdf-link-input" placeholder="貼上 PDF 網址...">
      <button onclick="savePdfLink()">儲存</button>
    </div>
  </div>
</div>
<div id="pdf-open-bar"></div>
<div id="pdf-viewer-panel" class="pdf-viewer-panel" style="display:none;">
  <div class="pdf-toolbar">
    <button id="pdfHighlightModeBtn" class="pdf-tool-btn active">🖍️ 畫重點</button>
    <button id="pdfEraseModeBtn" class="pdf-tool-btn">🧹 擦除</button>
    <button id="pdfClearPageBtn" class="pdf-tool-btn pdf-tool-danger">清空本頁</button>
    <span class="pdf-toolbar-sep"></span>
    <button id="pdfPrevBtn" class="pdf-tool-btn">‹ 上一頁</button>
    <input id="pdfPageNum" class="pdf-page-input" type="number" min="1" value="1">
    <span id="pdfPageInfo" class="pdf-page-info">/ --</span>
    <button id="pdfNextBtn" class="pdf-tool-btn">下一頁 ›</button>
    <span class="pdf-toolbar-sep"></span>
    <button id="pdfZoomOutBtn" class="pdf-tool-btn">－</button>
    <span id="pdfZoomLabel" class="pdf-zoom-label">100%</span>
    <button id="pdfZoomInBtn" class="pdf-tool-btn">＋</button>
    <span class="pdf-toolbar-spacer"></span>
    <span id="pdfStatus" class="pdf-status"></span>
    <button id="pdfCloseBtn" class="pdf-tool-btn">✕ 關閉</button>
  </div>
  <div id="pdf-viewer-wrap" class="pdf-viewer-wrap">
    <div class="pdf-loading">PDF 載入中…</div>
  </div>
</div>
<div id="app" class="layout">
  <div class="player-col">
    <div class="subject" id="subject"></div>
    <div id="player-resizable" class="player-resizable">
      <div id="player"></div>
      <div id="resize-handle" class="resize-handle" title="拖曳調整影片大小"></div>
    </div>
    <div class="resize-hint">🔧 拖曳右下角的手把調整影片大小</div>
    <div class="chat-box">
      <div class="chat-header">💬 問 AI(已載入這支影片的內容)</div>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="輸入問題,按 Enter 送出">
        <button id="chat-send-btn" onclick="sendChatMessage()">送出</button>
      </div>
      <div id="chat-notice" class="chat-notice"></div>
    </div>
  </div>
  <div class="list-col">
    <h3>📝 選擇題</h3>
    <div id="mc-list"></div>
    <h3>🧠 背誦重點(點空格看答案)</h3>
    <div id="cz-list"></div>
    <div class="finish-row">
      <button class="finish-btn" onclick="finishQuiz()">✅ 作答完成</button>
      <button class="finish-btn" id="collapse-correct-btn" style="display:none;" onclick="toggleCollapseCorrect()">📂 展開已學會的題目</button>
      <span id="score-summary"></span>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="./chat-config.js"></script>
<script src="./viewer.js"></script>
</body>
</html>
